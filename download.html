<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"><style>
:root{--ink:#0b1238;--blue:#3b4ef0;--sky:#97a6ff;--yellow:#ffc72c;--red:#e4392b;--mist:#f0f3ff;--line:#dce2fb;--mute:#59679a;
--display:'Bricolage Grotesque',Georgia,serif;--body:'DM Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);color:var(--ink);background:var(--mist);line-height:1.65}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.08}
.wrap{max-width:1120px;margin:auto;padding:0 5vw}
header{position:sticky;top:0;z-index:20;background:#0b1238ee;backdrop-filter:blur(8px);color:#fff}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.logo{font:800 1.25rem var(--display)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:8px 16px;border-radius:99px;color:#c9d3f0;font-weight:500;transition:.2s}
nav a:hover{color:#fff;background:#ffffff18}
nav a.on{background:var(--yellow);color:var(--ink);font-weight:700}
.btn{display:inline-block;background:var(--yellow);color:var(--ink);font-weight:700;border:0;border-radius:14px;padding:15px 28px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 24px #0004}
.btn.ghost{background:transparent;color:#fff;border:2px solid #ffffff55}
.btn.blue{background:var(--blue);color:#fff}
.tag{font-weight:700;font-size:.8rem;letter-spacing:.12em;color:var(--blue);margin-bottom:10px}
/* hero */
.hero{background:radial-gradient(900px 400px at 85% 10%,#3b4ef055,transparent 60%),var(--ink);color:#fff;padding-top:80px;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:center;padding-bottom:80px}
.hero .tag{color:var(--yellow)}
.hero h1{font-size:clamp(2.6rem,6.4vw,4.8rem);font-weight:800}
.hero h1 b{color:var(--yellow)}
.hero p.lead{color:#c3cdff;margin:22px 0 32px;max-width:48ch;font-size:1.1rem}
.acts{display:flex;gap:12px;flex-wrap:wrap}
.track{height:36px;position:relative;background:linear-gradient(var(--sky),var(--sky)) 0 12px/100% 4px no-repeat,repeating-linear-gradient(90deg,#3a4a7c 0 6px,transparent 6px 26px) 0 22px/100% 12px no-repeat}
.train{position:absolute;bottom:14px;left:-60px;font-size:2.2rem;transform:scaleX(-1);animation:go 5s ease-out forwards}
@keyframes go{to{left:calc(100% - 100px)}}
.ticket{background:#fff;color:var(--ink);border-radius:22px;position:relative;box-shadow:0 24px 60px #0006;overflow:visible}
.ticket .top{padding:26px 28px 22px;display:flex;justify-content:space-between;align-items:center}
.ready{background:var(--yellow);border-radius:99px;padding:3px 14px;font-weight:800;font-size:.8rem}
.ticket .mid{display:flex;align-items:center;gap:14px;padding:0 28px 24px}
.ticket .mid div{flex:1}
.ticket .mid .ic{flex:0;font-size:2rem}
.ticket .mid i{display:block;border-top:3px dotted var(--blue)}
.lab{font-size:.72rem;letter-spacing:.1em;color:#6b779c;font-weight:700}
.val{font:800 1.15rem var(--display)}
.ticket .cut{border-top:2px dashed var(--line);position:relative;margin:0 14px}
.ticket .cut:before,.ticket .cut:after{content:"";position:absolute;top:-13px;width:26px;height:26px;border-radius:50%;background:var(--ink)}
.ticket .cut:before{left:-27px}.ticket .cut:after{right:-27px}
.ticket .bot{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:22px 28px}
/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:16px;margin-top:-34px;position:relative;z-index:2}
.stat{background:#fff;border-radius:18px;padding:22px;border:1px solid var(--line);box-shadow:0 12px 30px #0b12381a;border-bottom:5px solid var(--blue)}
.stat:nth-child(2){border-color:var(--yellow)}.stat:nth-child(3){border-color:var(--red)}.stat:nth-child(4){border-color:var(--ink)}
.stat b{font:800 1.25rem var(--display);display:block}.stat span{color:var(--mute);font-size:.92rem}
.stat em{font:800 .85rem var(--display);font-style:normal;color:var(--blue)}
section.s{padding:90px 0 20px}
h2{font-size:clamp(1.9rem,4.2vw,3rem);font-weight:800;margin-bottom:14px}
.sub{color:var(--mute);max-width:56ch;margin-bottom:40px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:22px}
.card{background:#fff;border-radius:22px;padding:30px;border:1px solid var(--line);transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column;gap:8px}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 36px #3b4ef026}
.card .n{font:800 .9rem var(--display);color:var(--sky)}
.card .ic{width:54px;height:54px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:1.5rem;margin-bottom:6px}
.card:nth-child(2) .ic{background:var(--yellow);color:var(--ink)}.card:nth-child(3) .ic{background:var(--red)}
.card p{color:var(--mute);flex:1}
.card a{font-weight:700;color:var(--blue)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:18px;counter-reset:s}
.step{background:#fff;border-radius:20px;padding:26px;border-top:5px solid var(--blue);counter-increment:s}
.step:before{content:counter(s);display:block;font:800 3rem var(--display);color:var(--yellow);-webkit-text-stroke:1.5px var(--ink);line-height:1}
.step:nth-child(even){border-color:var(--yellow)}
.step p{color:var(--mute)}
.band{background:var(--ink);color:#fff;border-radius:30px;padding:56px 5vw;margin-top:90px;display:grid;grid-template-columns:1.2fr 1fr;gap:30px;align-items:center}
.band p{color:#c3cdff;margin:14px 0 26px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips div{background:#ffffff12;border:1px solid #ffffff24;border-radius:16px;padding:16px}
.chips b{font:800 1.05rem var(--display);color:var(--yellow);display:block}.chips span{font-size:.78rem;letter-spacing:.1em;color:#c3cdff}
.cta{text-align:center;padding:90px 0}
.cta h2{margin-bottom:22px}
/* inner pages */
.pagehead{background:var(--ink);color:#fff;padding:60px 0 70px;position:relative}
.pagehead p{color:#c3cdff;margin-top:10px}
.pagehead h1{font-size:clamp(2.2rem,5vw,3.6rem);font-weight:800}
.panel{background:#fff;border-radius:24px;padding:34px;border:1px solid var(--line);box-shadow:0 14px 36px #0b123818;margin:-36px auto 80px;position:relative}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:20px;margin:24px 0}
label{display:block;font-weight:700;font-size:.9rem;margin-bottom:6px}
select,input{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
select:focus,input:focus{border-color:var(--blue);outline:0}
.pax{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin-bottom:12px;padding:16px;background:var(--mist);border-radius:16px}
.err{color:var(--red);font-weight:700;margin:12px 0;min-height:1.5em}
#tickets{display:grid;gap:24px;margin:0 auto 80px}
#tickets:empty{display:none}
.sum{background:var(--ink);color:#fff;border-radius:20px;padding:22px 28px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sum b{font:800 1.9rem var(--display);color:var(--yellow)}
.tk{display:grid;grid-template-columns:1fr 170px;background:#fff;border-radius:20px;position:relative;box-shadow:0 14px 36px #0b123822}
.tk .m{padding:24px 28px}.tk .st{padding:24px 18px;border-left:2px dashed var(--line);text-align:center;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.tk:before,.tk:after{content:"";position:absolute;right:157px;width:26px;height:26px;border-radius:50%;background:var(--mist)}
.tk:before{top:-13px}.tk:after{bottom:-13px}
.rt{display:flex;align-items:center;gap:12px;margin:8px 0}
.rt strong{font:800 2.2rem var(--display)}.rt i{flex:1;border-top:3px dotted var(--blue)}
.dg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.price{font:800 1.8rem var(--display);color:var(--blue)}
.ok{background:var(--yellow);border-radius:99px;padding:2px 12px;font-weight:800;font-size:.78rem}
.bar{display:flex;height:42px;justify-content:center}.bar span{background:var(--ink)}
/* about / help */
.prose{background:#fff;border-radius:24px;padding:40px;border:1px solid var(--line);box-shadow:0 14px 36px #0b123818;margin:-36px auto 80px;position:relative;border-left:8px solid var(--yellow)}
.prose h2{font-size:2rem}.prose p,.prose li{color:var(--mute);margin-bottom:14px;max-width:70ch}.prose ul{padding-left:22px}
.prose details{border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:12px}.prose summary{font-weight:700;cursor:pointer}
footer{background:var(--ink);color:#c3cdff;text-align:center;padding:36px 5vw}
footer b{display:block;font:800 1.2rem var(--display);color:#fff}footer em{font-style:normal;color:var(--yellow);font-weight:700}
@media(max-width:820px){.hero .wrap,.band{grid-template-columns:1fr}.dg{grid-template-columns:1fr 1fr}.tk{grid-template-columns:1fr}.tk .st{border-left:0;border-top:2px dashed var(--line)}.tk:before,.tk:after{display:none}.pax{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.train{animation:none;left:calc(100% - 100px)}*{transition:none!important}}
@media print{header,footer,.panel,.pagehead,.sum button{display:none!important}body{background:#fff}#tickets{margin:0}.tk{box-shadow:none;border:2px solid var(--ink);break-inside:avoid}}
 
.hg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:20px;margin:-36px auto 80px;position:relative}.hc{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;border-top:5px solid var(--blue);transition:transform .2s,box-shadow .2s}.hc:nth-child(3n+2){border-color:var(--yellow)}.hc:nth-child(3n){border-color:var(--red)}.hc:hover{transform:translateY(-4px);box-shadow:0 16px 34px #3b4ef022}.hc h2{font-size:1.25rem;margin-bottom:12px}.hc p{color:var(--mute);margin-bottom:10px}.hc ul{padding-left:20px;color:var(--mute)}.hc li{margin-bottom:4px}.hc li::marker{color:var(--blue)}.formula{background:var(--ink);color:#fff;border-radius:14px;padding:14px 18px;margin-top:6px}.formula b{color:var(--yellow)}.hc.wide{grid-column:1/-1}
 
footer{font-size:.74rem;padding:26px 5vw}footer b{font-size:.95rem}
.rh{display:flex;justify-content:space-between;align-items:end;gap:10px;flex-wrap:wrap;margin:10px 0 18px}.rh h2{font-size:1.7rem;margin:0}
.tr{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px 24px;margin-bottom:16px;box-shadow:0 8px 22px #0b123812}
.trh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.ty{background:var(--ink);color:#fff;border-radius:99px;padding:2px 12px;font-size:.72rem;font-weight:700}
.tm{display:flex;align-items:center;gap:16px}.tm>div{display:flex;flex-direction:column}.tm strong{font:800 1.5rem var(--display)}
.du{flex:1;align-items:center;text-align:center}.du i{width:100%;border-top:3px dotted var(--blue);margin-bottom:4px}
.cls{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.chip{background:var(--mist);border:2px solid var(--line);border-radius:14px;padding:8px 16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:104px;transition:.15s;color:var(--ink)}
.chip b{font:800 1.05rem var(--display)}.chip small{font-size:.68rem;color:var(--mute)}.chip span{font-weight:700;color:var(--blue)}
.chip:hover,.chip.sel{background:var(--yellow);border-color:var(--ink);transform:translateY(-2px)}.chip.sel span{color:var(--ink)}
.note{color:var(--mute);font-size:.85rem;margin-bottom:24px}
.bkp{margin:0 auto 30px}.sel-s{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:18px;margin-bottom:18px;border-bottom:2px dashed var(--line)}
.val{font:800 1.1rem var(--display)}.pax{grid-template-columns:2fr 1fr 1fr 1.4fr}
#trains{margin-bottom:10px}
@media(max-width:820px){.tm strong{font-size:1.15rem}.pax{grid-template-columns:1fr}}
@media print{#trains,#bk,.sum{display:none!important}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
 
/* v4 polish */
header .wrap{flex-wrap:nowrap;gap:6px;padding:10px 3vw}
.logo{font-size:clamp(.66rem,3.1vw,1.25rem);white-space:nowrap}
nav{flex-wrap:nowrap;gap:2px}
nav a{white-space:nowrap;font-size:clamp(.62rem,2.7vw,.95rem);padding:6px clamp(5px,1.3vw,16px)}
.hero{background:radial-gradient(900px 420px at 85% 0,#3b4ef070,transparent 60%),radial-gradient(600px 300px at 0 100%,#ffc72c26,transparent 60%),var(--ink)}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(#ffffff09 1px,transparent 1px) 0 0/100% 38px,linear-gradient(90deg,#ffffff09 1px,transparent 1px) 0 0/38px 100%;pointer-events:none}
.hero .wrap{position:relative}
.hero h1 b{background:linear-gradient(90deg,#ffc72c,#ff9e2c);-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{background:linear-gradient(135deg,#ffd75e,#ffb300);box-shadow:0 6px 16px #ffb30040}
.btn.blue{background:linear-gradient(135deg,#6575ff,#2a35c8);box-shadow:0 6px 18px #3b4ef055;color:#fff}
.btn.ghost{background:transparent;box-shadow:none;color:#fff}
.tag{display:inline-block;background:#3b4ef014;padding:4px 14px;border-radius:99px}
.hero .tag{background:#ffc72c22}
.pagehead{background:radial-gradient(700px 260px at 90% 0,#3b4ef070,transparent 60%),var(--ink)}
.panel{border-top:5px solid var(--yellow)}
.card,.stat,.step,.hc,.tr,.tk{animation:up .55s both}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
.card:before{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:#3b4ef00f}
.card{position:relative;overflow:hidden}
.tk{border-left:8px solid var(--blue)}
.tk .m{padding-left:22px}
.pax{grid-template-columns:2fr 1fr 1fr}.pt{grid-column:1/-1;font:800 .95rem var(--display);color:var(--blue)}
.bps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:12px;margin-bottom:12px}
.sa{font-style:normal;font-weight:800;font-size:.72rem;border-radius:99px;padding:1px 10px;display:inline-block;margin-top:2px}
.st-avl{background:#dff5ec;color:#0c7a55}.st-rac{background:#fff0c2;color:#8a5a00}.st-wl{background:#fde2df;color:#c0291d}
.bd{display:inline-block;border-radius:99px;padding:3px 12px;font-weight:800;font-size:.78rem;color:#fff}
.bd.cnf{background:#12805c}.bd.rac{background:var(--yellow);color:var(--ink)}.bd.wl{background:var(--red)}
.chip{min-width:112px}

(()=>{let r=false;try{const n=performance.getEntriesByType("navigation")[0];r=n?n.type==="reload":!!(performance.navigation&&performance.navigation.type===1)}catch(e){}

 const fp=(ox,oy)=>{for(let y=-1;y<8;y++)for(let x=-1;x<8;x++){const X=ox+x,Y=oy+y;if(X<0||Y<0||X>=N||Y>=N)continue;const e=x>=0&&x<7&&y>=0&&y<7;m[Y][X]=e&&(x==0||y==0||x==6||y==6||(x>=2&&x<=4&&y>=2&&y<=4))?1:0}};fp(0,0);fp(N-7,0);fp(0,N-7);return m};
const qr=s=>{const m=qrM(s),N=25;let r="";for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(m[y][x])r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;return`<svg class="qr" viewBox="0 0 ${N} ${N}" aria-hidden="true">${r}</svg>`};

const saveBk=X=>{const a=getAll().filter(b=>b.pnr!=X.pnr);a.unshift(X);setAll(a.slice(0,60))};
const findBk=p=>getAll().find(b=>b.pnr==p);
const idxOf=(X,cx)=>X.pax.map((p,i)=>i).filter(i=>cx?!!X.pax[i].cx:!X.pax[i].cx);

function refund(X,p){const fare=p.fare??X.fr,h=X.iso?(depTs(X)-Date.now())/36e5:999;
 if(h<=0)return{ok:false,msg:"The train has already departed, so this ticket cannot be cancelled."};
 if(!p.ok){const c=Math.min(20,fare);return{ok:true,fare,charge:c,refund:fare-c,note:"Waiting list ticket: full refund minus Rs. 20."}}
 if(X.q=="Tatkal")return{ok:true,fare,charge:fare,refund:0,note:"Tatkal tickets are non-refundable."};
 const flat=Math.min(p.half?Math.round((FLAT[X.k]||120)/2):(FLAT[X.k]||120),fare);let c,note;
 if(h>48){c=flat;note="More than 48 hours before departure: fixed cancellation charge."}

 c=Math.min(c,fare);return{ok:true,fare,charge:c,refund:fare-c,note}}

 d.querySelector("#cxok").onclick=()=>{applyCancel(X.pnr,idx);d.remove();POP(`<div class="cxdone">✓</div><h3>Ticket cancelled</h3><p>Refund of <b>${rs(tot)}</b> will be credited in 5-7 working days (simulation). The cancelled ticket now appears on the Cancel page.</p><div class="mb"><button type="button" class="btn blue" data-close>OK</button></div>`)}}

<div class="tk2f">Simulation ticket · for learning purposes only · Have a safe journey 🚂</div></article>`}).join("");
const confetti=()=>{if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const C=["#ffc72c","#7c5cff","#3b4ef0","#2fe39a","#ff6a5c","#ffffff"];for(let i=0;i<70;i++){const e=document.createElement("i");e.className="cf";e.style.left=Math.random()*100+"vw";e.style.background=C[i%6];e.style.setProperty("--dx",(Math.random()*200-100)+"px");e.style.animationDelay=Math.random()*.5+"s";e.style.animationDuration=(1.8+Math.random()*1.4)+"s";document.body.appendChild(e);setTimeout(()=>e.remove(),4300)}};

const esc=s=>String(s).replace(/[^\x20-\x7e]/g,"?").replace(/[\\()]/g,"\\$&");
const N="0.04 0.07 0.22",G="0.43 0.47 0.6";
const tx=(x,y,s,z,b,c)=>`BT /F${b?2:1} ${z} Tf ${c||N} rg ${x} ${y} Td (${esc(s)}) Tj ET\n`;
const rc=(x,y,w,h,c)=>`${c} rg ${x} ${y} ${w} ${h} re f\n`;
function mkpdf(pg){let out="%PDF-1.4\n",off=[];const add=s=>{off.push(out.length);out+=off.length+" 0 obj\n"+s+"\nendobj\n"};
 add("<</Type/Catalog/Pages 2 0 R>>");add("<</Type/Pages/Kids["+pg.map((_,i)=>(5+i*2)+" 0 R").join(" ")+"]/Count "+pg.length+">>");
 add("<</Type/Font/Subtype/Type1/BaseFont/Helvetica>>");add("<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold>>");
 pg.forEach((c,i)=>{add("<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</Font<</F1 3 0 R/F2 4 0 R>>>>/Contents "+(6+i*2)+" 0 R>>");add("<</Length "+c.length+">>\nstream\n"+c+"\nendstream")});
 const x=out.length;out+="xref\n0 "+(off.length+1)+"\n0000000000 65535 f \n"+off.map(v=>String(v).padStart(10,"0")+" 00000 n \n").join("")+"trailer\n<</Size "+(off.length+1)+"/Root 1 0 R>>\nstartxref\n"+x+"\n%%EOF";
 return new Blob([out],{type:"application/pdf"})}
function pdf(items,name){const pg=[];
 items.forEach(({X,p},i)=>{if(i%3==0)pg.push("");const by=562-(i%3)*270,T=X.q=="Tatkal",HC=T?"0.66 0.07 0.24":N;let c=`${HC} RG 1.2 w 30 ${by} 535 250 re S\n`+rc(30,by+215,535,35,HC)+tx(42,by+228,"Railway Ticket Booking",14,1,"1 1 1")+(T?tx(205,by+229,"| TATKAL",10,1,"1 0.85 0.4"):"")+tx(340,by+229,"PNR "+X.pnr+"  |  ID "+p.tid,9,0,"1 1 1");
  c+=tx(42,by+170,X.a,28,1,T?HC:N)+tx(300,by+170,X.b,28,1,T?HC:N)+tx(134,by+176,"------- "+X.dist+" km -------",9,0,T?"1 0.42 0.3":"0.23 0.31 0.94");
  c+=tx(42,by+152,X.an,10)+tx(300,by+152,X.bn,10)+tx(42,by+137,"DEPARTS "+X.dep+"  |  "+X.dd,10,1)+tx(300,by+137,"ARRIVES "+X.arr+"  |  "+X.ad,10,1);
  c+=tx(42,by+118,X.tn+" (#"+X.tno+") - "+X.ty+"  |  Duration "+X.dur,10,0,T?HC:"0.23 0.31 0.94");
  c+=rc(440,by+160,110,26,p.ok?"0.07 0.5 0.36":"0.89 0.22 0.17")+tx(450,by+169,p.lab,11,1,"1 1 1")+(p.half?tx(440,by+196,"HALF TICKET (CHILD)",9,1,"0.85 0.4 0.05"):"");
  [["Passenger",p.name],["Age / Gender",p.age+" / "+p.g],["Class / Quota",X.cn+" / "+X.q],["Seat No.",p.seat],["Berth / Seat Type",p.bt],["Fare","Rs. "+Number(p.fare??X.fr).toLocaleString("en-IN")+(p.half?" (HALF)":"")]].forEach((r,j)=>{const x=42+(j%3)*148,y=by+86-Math.floor(j/3)*38;c+=tx(x,y+14,r[0].toUpperCase(),7,0,G)+tx(x,y,String(r[1]).slice(0,20),11,1)});
  const M=qrM(X.pnr+p.tid),s=2.2;for(let y=0;y<25;y++)for(let x=0;x<25;x++)if(M[y][x])c+=rc((492+x*s).toFixed(1),(by+127-(y+1)*s).toFixed(1),s.toFixed(1),s.toFixed(1),N);
  let bx=420;barA(p.tid).forEach(([w,m])=>{c+=rc(bx.toFixed(1),by+14,(w*.8).toFixed(1),24,N);bx+=w*.8+m*.6});
  c+=tx(42,by+16,"Simulation ticket - for learning purposes only",7,0,G);pg[pg.length-1]+=c});
 const u=URL.createObjectURL(mkpdf(pg)),a=document.createElement("a");a.href=u;a.download=name+".pdf";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
function renderDl(){const box=$("dlbox");if(!box)return;const L=activeList();
 if(!L.length){box.innerHTML=`<div class="panel empty"><h2>No active tickets</h2><p>Your booked tickets are shown here. Book a ticket first. Cancelled tickets move to the Cancel page.</p><a class="btn blue" href="booking.html" data-go="booking">Book Ticket →</a></div>`;return}
 const n=L.reduce((s,b)=>s+b.idx.length,0);
 box.innerHTML=`<div class="dlhead"><div><b>${n}</b> active ticket${n>1?"s":""} · <b>${L.length}</b> booking${L.length>1?"s":""}</div><button type="button" class="btn" id="dall">⬇ Download All (PDF)</button></div>`+L.map(({X,idx})=>`<section class="bkg">${bannerHTML(sub(X,idx))}<div class="dlbar"><button type="button" class="btn dpb" data-pnr="${E(X.pnr)}">⬇ Download PDF</button><a class="btn ghost2" href="cancel.html#p=${E(X.pnr)}" data-go="cancel" data-p="${E(X.pnr)}">✕ Cancel Ticket</a></div>${tkHTML(sub(X,idx))}</section>`).join("");
 $("dall").onclick=()=>pdf(L.flatMap(({X,idx})=>idx.map(i=>({X,p:X.pax[i]}))),"Tickets-"+n);
 box.querySelectorAll(".dpb").forEach(b=>b.onclick=()=>{const e=L.find(l=>l.X.pnr==b.dataset.pnr);pdf(e.idx.map(i=>({X:e.X,p:e.X.pax[i]})),"Ticket-"+e.X.pnr)})}
addEventListener("rtb-updated",()=>renderDl());
